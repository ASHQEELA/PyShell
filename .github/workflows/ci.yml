name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: python -m pyflakes myshell tests
      - name: Test
        run: python -m pytest -q

  build:
    name: uv build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Run the built wheel
        run: uvx --from dist/*.whl myshell -c "echo built ok"
